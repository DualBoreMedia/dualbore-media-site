<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>DualBore Media waitlist test fixture</title></head><body>
<form name="drop-waitlist" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="drop-waitlist">
  <input name="bot-field">
  <input name="name" type="text">
  <input name="email" type="email">
  <select name="style"><option value="e92-tee">E92 Coupe Line-Art Tee</option><option value="e90-crewneck">E90 Sedan Front-Clip Crewneck</option><option value="sv1000s-silhouette">SV1000S Silhouette Crewneck</option></select>
  <select name="size"><option>S</option><option>M</option><option>L</option><option>XL</option><option>2XL</option></select>
  <input name="consent" type="checkbox" value="yes">
</form>
</body></html>
